name: Build Image - MinGW64-Unit-Tests

on:
  workflow_dispatch: # Triggered by Build Image - MinGW64-CI

  push:
    branches: [main]
    paths:
      - 'mingw64-unit-tests.Dockerfile'
      - '.github/workflows/build-image-mingw64-unit-tests.yml'

env:
  DOCKERFILE_CONTEXT: ./
  IMAGE_NAME: mingw64-unit-tests
  VERSION: v1.0.0

jobs:
  build-image-mingw64-unit-tests:
    runs-on: ${{ vars.RUNNER }}
    permissions:
      packages: write
      contents: write

    steps:
      # Extract the variables
      - run: echo "REPOSITORY_OWNER_LOWERCASE=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Setup the environement
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GIT_TOKEN }}

      # Build & Push docker image
      - uses: docker/build-push-action@v7
        with:
          context: ${{ env.DOCKERFILE_CONTEXT }}
          file: ${{ env.DOCKERFILE_CONTEXT }}${{ env.IMAGE_NAME }}.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPOSITORY_OWNER_LOWERCASE }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.REPOSITORY_OWNER_LOWERCASE }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.title=MinGW64-Unit-Tests - Docker Image
            org.opencontainers.image.description=Docker image containing the Unit-Tests build environment used for the windows cross compilation (mingw64) of c++/c unit tests run with wine
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/pkgs/container/${{ env.IMAGE_NAME }}
            org.opencontainers.image.dockerfile=mingw64-unit-tests.Dockerfile
            org.opencontainers.image.licenses=MIT
          annotations: |
            index:org.opencontainers.image.title=MinGW64-Unit-Tests - Docker Image
            index:org.opencontainers.image.description=Docker image containing the Unit-Tests build environment used for the windows cross compilation (mingw64) of c++/c unit tests run with wine
            index:org.opencontainers.image.version=${{ env.VERSION }}
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.licenses=MIT
            manifest:org.opencontainers.image.title=MinGW64-Unit-Tests - Docker Image
            manifest:org.opencontainers.image.description=Docker image containing the Unit-Tests build environment used for the windows cross compilation (mingw64) of c++/c unit tests run with wine
            manifest:org.opencontainers.image.version=${{ env.VERSION }}
            manifest:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            manifest:org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Create and push the version tag
      - name: Update version tag
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${{ env.IMAGE_NAME }}/${{ env.VERSION }}$"; then
            echo "::warning::The tag ${{ env.IMAGE_NAME }}/${{ env.VERSION }} already exist on the remote."
            exit 0
          fi
          git tag ${{ env.IMAGE_NAME }}/${{ env.VERSION }}
          git push origin ${{ env.IMAGE_NAME }}/${{ env.VERSION }}

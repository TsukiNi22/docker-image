name: Build Image - CI

on:
  push:
    branches: [main]
    paths:
      - 'ci.Dockerfile'

env:
  DOCKERFILE_CONTEXT: ./
  IMAGE_NAME: ci

jobs:
  build-image-ci:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      # Extract the variables
      - run: echo "REPOSITORY_OWNER_LOWERCASE=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Setup the environement
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GIT_TOKEN }}

      # Build & Push docker image
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.DOCKERFILE_CONTEXT }}
          file: ${{ env.DOCKERFILE_CONTEXT }}${{ env.IMAGE_NAME }}.Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPOSITORY_OWNER_LOWERCASE }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
